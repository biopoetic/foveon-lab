name: mac-dmg

# Wraps the signed, notarized and stapled "Foveon Lab.app" (uploaded by
# tools/release to a temporary draft release) in a DMG — hdiutil only exists
# on macOS. Before that it checks the app with Apple's own tools. The DMG goes
# back to tools/release, which signs, notarizes and staples it locally.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Draft release holding the zipped Foveon Lab.app
        required: true
      version:
        description: Version, e.g. v0.3.0
        required: true

permissions:
  contents: write # read draft releases

jobs:
  dmg:
    # macos-latest (arm64) went unassigned for hours on 2026-11-04 ("capacity
    # constraints"); the app is universal, so an Intel runner builds the same DMG.
    runs-on: macos-15-intel
    steps:
      - name: Fetch the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.release }}" -R "$GITHUB_REPOSITORY" -p "*.zip" -D in

      - name: Unpack and verify with Apple's tools
        run: |
          mkdir stage
          ditto -x -k in/*.zip stage
          APP="stage/Foveon Lab.app"
          ls -la "$APP/Contents/MacOS"
          lipo -archs "$APP/Contents/MacOS/foveon-lab"
          if [ -e "$APP/Contents/MacOS/x3f_extract" ]; then lipo -archs "$APP/Contents/MacOS/x3f_extract"; fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          # stapler and spctl ask Apple's servers (CloudKit ticket lookup);
          # the runner's connection to them drops now and then ("The network
          # connection was lost", error 68 — v0.4.109 and v0.4.110 both failed
          # once on it). Retry those two; a real signing fault fails every try.
          retry() {
            for i in 1 2 3 4 5; do
              "$@" && return 0
              echo "attempt $i failed: $*"; sleep $((i * 15))
            done
            return 1
          }
          retry xcrun stapler validate "$APP"
          retry spctl --assess --type execute --verbose=4 "$APP"

      - name: Smoke test (starts, serves, quits)
        run: |
          "stage/Foveon Lab.app/Contents/MacOS/foveon-lab" -no-open -port 8790 -photos "$RUNNER_TEMP" &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8790/api/caps && break; sleep 1; done
          curl -sf -X POST http://127.0.0.1:8790/api/quit

      - name: Build the DMG
        run: |
          ln -s /Applications stage/Applications
          hdiutil create -volname "Foveon Lab" -srcfolder stage -ov -format UDZO "Foveon-Lab-${{ inputs.version }}.dmg"
          hdiutil verify "Foveon-Lab-${{ inputs.version }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: foveon-lab-dmg
          path: Foveon-Lab-*.dmg
          if-no-files-found: error
